# docker compose -f compose.yaml -f compose.local-api.yaml up --build -d
services:
  nyarbot:
    group_add:
      - "${TELEGRAM_API_DATA_GID:-101}"
    environment:
      TELEGRAM_API_ROOT: http://telegram-bot-api:8081
      TELEGRAM_LOCAL_FILE_DIRECTORY: /var/lib/telegram-bot-api
    networks:
      - default
      - telegram-api
    volumes:
      - type: bind
        source: ${TELEGRAM_API_DATA_PATH:-../twprevbot/data/telegram-bot-api}
        target: /var/lib/telegram-bot-api
        read_only: true
        bind:
          create_host_path: false

networks:
  telegram-api:
    external: true
    name: ${TELEGRAM_API_NETWORK:-twprevbot_default}
